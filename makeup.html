<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>彩妝庫存管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --bg: #f7eded8f;
        --panel: #ffffff;
        --text: #263241;
        --muted: #718096;
        --line: #f2d8e2;
        --soft: #fff0f5;
        --primary: #df5d86;
        --primary-dark: #c83f6f;
        --danger: #d64545;
        --shadow: 0 16px 40px rgba(116, 39, 70, 0.12);
        --btn-gray: #e7e7e7;
        --col-gray: #626262;
        --col-d-pink: #f5d6de;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: "Noto Sans TC", Arial, "Microsoft JhengHei", "PingFang TC", sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      .app-header {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(16px);
      }

      .header-inner,
      .page {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
      }

      .header-main {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        padding: 18px 0 12px;
      }

      .title {
        margin: 0;
        color: var(--primary-dark);
        font-size: 24px;
        line-height: 1.2;
        white-space: nowrap;
      }

      .header-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: flex-end;
      }

      .header-actions .status {
        max-width: 190px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .search-box {
        flex: 1 1 260px;
        position: relative;
        margin-left: auto;
      }

      .filter-toggle-btn {
        display: none;
      }

      .search-box input,
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        border: 1px solid #e4e1e6;
        border-radius: 8px;
        color: var(--text);
        outline: 0;
      }

      .search-box input {
        padding: 8px 14px 8px 38px;
      }

      .search-icon {
        position: absolute;
        left: 13px;
        top: 50%;
        color: var(--primary);
        transform: translateY(-50%);
      }

      .primary-btn,
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 40px;
        border-radius: 8px;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }

      .primary-btn {
        padding: 0 20px;
        background: var(--primary);
        color: #fff;
        font-weight: 700;
      }

      .total-btn {
        width: 40px;
        padding: 0;
        background: #fff;
        border: 1px solid var(--line);
        color: var(--primary-dark);
      }

      .total-btn svg {
        flex: 0 0 auto;
      }

      .total-amount-display {
        color: var(--primary-dark);
        font-size: 34px;
        font-weight: 900;
        text-align: center;
      }

      .primary-btn:hover {
        background: var(--primary-dark);
      }

      .total-btn:hover {
        background: var(--soft);
      }

      .back-btn {
        background: var(--btn-gray);
        color: var(--col-gray);
      }

      .back-btn:hover {
        background-color: var(--col-d-pink);
        color: var(--primary-dark);
      }

      .primary-btn:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .icon-btn {
        width: 40px;
        background: #fff;
        color: var(--muted);
      }

      .icon-btn.filter-toggle-btn {
        display: none;
      }

      .icon-btn:hover,
      .icon-btn.active {
        background: var(--soft);
        color: var(--primary-dark);
      }

      .danger-btn {
        background-color: var(--btn-gray);
        color: var(--danger);
      }

      .danger-btn:hover {
        background-color: var(--col-d-pink);
      }

      .category-bar {
        display: flex;
        flex: 1 1 auto;
        gap: 8px;
        min-width: 0;
        overflow-x: auto;
        padding: 0;
      }

      .category-nav-row {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 0 0 14px;
      }

      .category-btn {
        flex: 0 0 auto;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 14px;
        background: #fff;
        color: var(--text);
        font-size: 14px;
        font-weight: 700;
      }

      .category-btn.active {
        border-color: var(--primary);
        background: var(--primary);
        color: #fff;
      }

      .category-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 8px;
        align-items: center;
      }

      .category-row + .category-row {
        margin-top: 8px;
      }

      .category-row input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        outline: 0;
      }

      .category-list {
        display: grid;
        gap: 8px;
        padding: 20px;
        overflow: auto;
      }

      .category-add {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        padding: 10px 20px 20px;
      }

      .category-add input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        outline: 0;
      }

      .page {
        padding: 15px 0 20px;
      }

      .status {
        margin: 0 0 0px;
        color: var(--muted);
        font-size: 13px;
      }

      .status.error {
        color: var(--danger);
        padding: 10px 20px;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 15px;
      }

      .count-pill {
        border-radius: 999px;
        padding: 8px 12px;
        background: #fff;
        color: var(--primary-dark);
        font-size: 13px;
        font-weight: 700;
      }

      .view-switch {
        display: flex;
        gap: 6px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
      }

      .card {
        display: flex;
        flex-direction: column;
        min-height: 270px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 8px 24px rgba(116, 39, 70, 0.06);
        overflow: hidden;
        cursor: pointer;
        will-change: transform, opacity;
      }

      .card.sold-card {
        border-color: #ddcbcb;
        background: #f4f5f7;
        box-shadow: none;
        filter: grayscale(0.35);
        .brand {
          color: #8e8e8e;
        }
        .tag {
          background: #dedede;
          color: #939393;
        }
        .meta-shop {
          background-color: #dfdfdf;
          color: #626262;
        }
      }

      .card-body {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
        padding: 16px;
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }

      .tag {
        width: fit-content;
        align-self: flex-start;
        border-radius: 999px;
        padding: 5px 9px;
        background: var(--soft);
        color: var(--primary-dark);
        font-size: 13px;
        font-weight: 700;
      }

      .sold-status {
        margin-left: auto;
        color: #6b7280;
        font-size: 12px;
        font-weight: 800;
        text-align: right;
        white-space: nowrap;
      }

      .checkbox-field {
        display: flex;
        align-items: center;
        min-height: 38px;
        gap: 8px;
      }

      .checkbox-field input {
        width: auto;
        accent-color: var(--primary);
      }

      .conditional-hidden {
        display: none;
      }

      .field[hidden] {
        display: none;
      }

      .actions {
        display: flex;
        gap: 4px;
      }

      .brand {
        margin: 0 0 0px;
        color: var(--primary);
        font-size: 12px;
        font-weight: 700;
      }

      .name {
        margin: 0;
        min-height: 48px;
        font-size: 17px;
        line-height: 1.45;
      }

      .price {
        margin-top: 16px;
        color: var(--text);
        font-size: 28px;
        font-weight: 800;
      }

      .price-rating {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        margin-top: 16px;
      }

      .price-rating .price {
        margin-top: 0;
      }

      .rating {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        color: #f0a500;
        font-size: 14px;
        white-space: nowrap;
      }

      .rating-empty {
        color: #d6d0d4;
      }

      .meta {
        display: grid;
        gap: 8px;
        border-top: 1px solid var(--line);
        padding: 14px 16px;
        color: var(--text);
        font-size: 13px;
        font-weight: 700;
      }

      .meta-pair {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .meta-chip {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .meta-shop {
        background-color: #f1f1f1;
        border-radius: 30px;
        padding: 5px 10px;
        color: #878787;
      }

      .thumb-strip,
      .image-preview,
      .detail-images {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .image-preview {
        gap: 15px;
        padding: 15px 0;
      }

      .preview-item {
        position: relative;
        width: calc(100% / 3 - 10px);
      }

      .image-remove-btn {
        position: absolute;
        top: -7px;
        right: -7px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border: 1px solid #fff;
        border-radius: 50%;
        background: var(--danger);
        color: #fff;
        font-size: 10px;

        line-height: 1;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
      }

      .thumb,
      .preview-img,
      .detail-img {
        width: calc(100% / 3 - 6px);
        height: 92px;
        border: 1px solid var(--line);
        border-radius: 8px;
        object-fit: cover;
        background: #fff3f7;
      }

      .preview-img {
        width: 100%;
        height: 152px;
      }

      .detail-img {
        width: calc(100% / 3 - 6px);
        height: 132px;
      }

      .image-viewer-img {
        display: block;
        max-width: min(920px, calc(100vw - 104px));
        max-height: calc(100vh - 96px);
        border-radius: 10px;
        object-fit: contain;
        background: #fff;
        box-shadow: var(--shadow);
      }

      .detail-body {
        display: grid;
        flex: 1 1 auto;
        gap: 16px;
        min-height: 0;
        padding: 20px;
        overflow: auto;
        background: #fff;
      }

      #detailBody {
        display: flex;
        flex-direction: column;
        gap: 0;
        padding: 0;
        background: #fff;
        overflow: hidden;
      }

      .detail-title {
        display: grid;
        gap: 8px;
      }

      .detail-title h3 {
        margin: 0;
        font-size: 22px;
        line-height: 1.35;
      }

      .detail-grid {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .detail-cell {
        display: grid;
        gap: 8px;
      }

      .detail-cell span {
        display: block;
        color: #6f607a;
        font-size: 14px;
        font-weight: 700;
      }

      .detail-value {
        min-height: 36px;
        border: 1px solid #e4e1e6;
        border-radius: 8px;
        padding: 8px 12px;
        background: #f7f7f8;
        color: #18304a;
        /* line-height: 1.35; */
      }

      .detail-actions {
        display: flex;
        gap: 8px;
        justify-content: center;
      }

      #detailBody > .detail-actions {
        position: static;
        z-index: 2;
        margin: 0;
      }

      .form-actions {
        display: flex;
        flex: 0 0 auto;
        gap: 8px;
        justify-content: center;
        padding: 15px 20px;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .form-scroll {
        display: grid;
        gap: 14px;
        min-height: 0;
        overflow: auto;
        padding: 20px;
      }

      #itemForm,
      #detailEditForm {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        min-height: 0;
        padding: 0;
        
        background: #fff;
      }

      #detailBody.editing {
        padding: 0;
        overflow: hidden;
      }

      #detailBody.editing #detailEditForm {
        height: 100%;
      }

      #detailBody > .form-scroll {
        flex: 1 1 auto;
        min-height: 0;
        padding: 20px;
        overflow: auto;
      }

      #detailEditForm > .detail-actions {
        flex: 0 0 auto;
        z-index: 2;
      }

      .inline-form {
        padding: 0;
      }

      .note {
        border-radius: 8px;
        padding: 8px;
        background: #f2f2f2;
        color: var(--text);
        font-weight: 400;
        line-height: 1.45;
      }

      .table-wrap {
        max-height: calc(100vh - 233px);
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .table-wrap .note {
        padding: 0;
        background-color: #fff;
      }

      table {
        width: 100%;
        min-width: 1040px;
        border-collapse: collapse;
        text-align: left;
      }

      th,
      td {
        padding: 14px;
        border-bottom: 1px solid var(--line);
        /* vertical-align: top; */
      }

      th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #fff3f7;
        color: var(--primary-dark);
        font-size: 13px;
      }

      tr:last-child td {
        border-bottom: 0;
      }
      tr:hover td {
        background-color: #f1f1f18f;
      }

      .empty {
        /* background: rgba(255, 255, 255, 0.65);
        border: 1px solid var(--line);
        border-radius: 8px; */
        padding: 48px 16px;
        color: var(--muted);
        text-align: center;
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px;
        background: rgba(38, 50, 65, 0.58);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      .modal.open {
        display: flex;
      }

      .saving-overlay {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        place-items: center;
        background: rgba(255, 248, 251, 0.78);
        backdrop-filter: blur(8px);
      }

      .saving-overlay.open {
        display: grid;
      }

      .scroll-top-btn {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 20;
        width: 44px;
        min-height: 44px;
        border: 1px solid var(--line);
        box-shadow: 0 10px 24px rgba(116, 39, 70, 0.16);
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
      }

      .scroll-top-btn.visible {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .saving-box {
        display: grid;
        gap: 12px;
        place-items: center;
        min-width: 180px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 22px 26px;
        background: #fff;
        box-shadow: var(--shadow);
        color: var(--primary-dark);
        font-weight: 800;
      }

      .saving-spinner {
        width: 38px;
        height: 38px;
        border: 4px solid #f8dce7;
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: savingSpin 0.8s linear infinite;
      }

      @keyframes savingSpin {
        to {
          transform: rotate(360deg);
        }
      }

      .dialog {
        display: flex;
        flex-direction: column;
        width: min(520px, 100%);
        max-height: min(740px, calc(100vh - 36px));
        overflow: hidden;
        border-radius: 10px;
        box-shadow: var(--shadow);
        will-change: transform, opacity;
      }

      .dialog.image-viewer-dialog {
        position: relative;
        width: auto;
        max-height: none;
        overflow: visible;
        background: transparent;
        box-shadow: none;
      }

      .image-viewer-dialog .image-viewer-close {
        position: absolute;
        top: 5px;
        right: 5px;
        z-index: 2;
        background: #5050507d;
        box-shadow: 0 10px 24px rgba(38, 50, 65, 0.22);
      }

      .dialog-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 15px;
        background: var(--primary);
        color: #fff;
        flex: 0 0 auto;
      }

      .dialog-head h2 {
        margin: 0;
        font-size: 16px;
      }

      .dialog-head-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .close-btn {
        width: 38px;
        height: 38px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
        font-size: 24px;
        line-height: 1;
      }

      form {
        display: grid;
        gap: 14px;
        padding: 20px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field label {
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
      }

      .field input,
      .field select,
      .field textarea {
        padding: 8px 12px;
      }

      .field textarea {
        min-height: 92px;
        resize: vertical;
      }

      .file-input {
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 14px;
        background: #fffafd;
      }

      .full {
        grid-column: 1 / -1;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 720px) {
        .header-main {
          gap: 10px;
          padding: 10px 0;
        }

        .header-actions {
          margin-left: auto;
        }
        .page {
          padding: 15px 0 17px;
        }
        .search-box {
          order: 3;
          flex: 1 1 calc(100% - 50px);
          margin-left: 0;
        }

        .icon-btn.filter-toggle-btn {
          display: inline-flex;
          order: 3;
          flex: 0 0 40px;
        }

        .category-nav-row {
          display: none;
          padding: 0 0 12px;
        }

        .category-nav-row.open {
          display: flex;
        }

        .title {
          flex: 1 1 auto;
          min-width: 0;
          font-size: 20px;
        }

        .primary-btn span {
          display: none;
        }

        .preview-item {
          position: relative;
          width: calc(100% / 2 - 10px);
        }

        .form-grid {
          grid-template-columns: 1fr;
        }

        .detail-grid {
          grid-template-columns: 1fr;
        }

        #detailBody > .form-scroll,
        #detailEditForm > .form-scroll {
          padding: 16px;
        }

        .form-actions {
          padding: 10px 16px;
        }

        .detail-actions {
          flex-wrap: wrap;
        }

        .table-wrap {
          max-height: calc(100vh - 200px);
        }

        .image-viewer-close {
          position: absolute;
          top: 50%;
          right: -46px;
        }
        .icon-btn {
          width: 35px;
        }
        .primary-btn,
        .icon-btn {
          min-height: 35px;
          padding: 0 10px;
        }

        .total-btn {
          width: 35px;
        }
      }
    </style>
  </head>

  <body>
    <header class="app-header">
      <div class="header-inner">
        <div class="header-main">
          <h1 class="title">彩妝庫存管理</h1>
          <label class="search-box">
            <span class="search-icon"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></span>
            <input id="searchInput" type="search" placeholder="搜尋品名或品牌" autocomplete="off" />
          </label>
          <button
            class="icon-btn filter-toggle-btn"
            id="filterToggleButton"
            type="button"
            title="篩選分類"
            aria-label="篩選分類"
            aria-expanded="false"
          >
            <i class="fa-solid fa-sliders" aria-hidden="true"></i>
          </button>
          <div class="header-actions">
            <button class="primary-btn total-btn" id="totalAmountButton" type="button" title="所有品項總金額" aria-label="所有品項總金額">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 7.5h16v9H4v-9Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
                <path d="M7 7.5V5h10v2.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M7 13.25h.01M17 10.75h.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
                <circle cx="12" cy="12" r="2.25" stroke="currentColor" stroke-width="1.7" />
              </svg>
            </button>

    <script>
      // 填入 Apps Script 部署後取得的 Web App URL。空字串時會用瀏覽器 localStorage。
      const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwz0g52Ts3ZUzGbkGSZneunCo1gvUdcUSPF3xSrpPI0VF6yqjXfAQXRrOADd66phfM/exec";

      };

      function useSheetApi() {
        return SHEET_API_URL.trim().length > 0;
      }

      function setStatus(message, isError = false) {
        els.syncStatus.textContent = message;
        els.syncStatus.classList.toggle("error", isError);
      }

      function loadLocalItems() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (!stored) return SAMPLE_ITEMS;

        try {
          const parsed = JSON.parse(stored);
          return Array.isArray(parsed) ? parsed : SAMPLE_ITEMS;
        } catch {
          return SAMPLE_ITEMS;
        }
      }

      function saveLocalItems() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.items));
      }

      function loadCategories() {
        const stored = localStorage.getItem(CATEGORIES_KEY);
        if (!stored) return [...DEFAULT_CATEGORIES];

        try {
          const parsed = JSON.parse(stored);
          return normalizeCategories(Array.isArray(parsed) ? parsed : DEFAULT_CATEGORIES);
        } catch {
          return [...DEFAULT_CATEGORIES];
        }
      }

      function saveCategories() {
        localStorage.setItem(CATEGORIES_KEY, JSON.stringify(state.categories));
      }

      function normalizeCategories(categories) {
        return [
          ...new Set(
            categories
              .map((category) => String(category).trim())
              .filter(Boolean)
              .filter((category) => category !== ALL_CATEGORY),
          ),
        ];
      }

      function getItemCategories() {
        return normalizeCategories(state.items.map((item) => item.category));
      }

      function getCategories() {
        return normalizeCategories([...state.categories, ...getItemCategories()]);
      }

      function getAllCategories() {
        return [ALL_CATEGORY, ...getCategories()];
      }

      function sheetJsonp(action) {
        return new Promise((resolve, reject) => {
          const callbackName = `sheetCallback_${Date.now()}_${Math.random().toString(36).slice(2)}`;
          const script = document.createElement("script");
          const url = new URL(SHEET_API_URL);

          url.searchParams.set("action", action);
          url.searchParams.set("callback", callbackName);

          window[callbackName] = (data) => {
            delete window[callbackName];
            script.remove();
            resolve(data);
          };

          script.onerror = () => {
            delete window[callbackName];
            script.remove();
            reject(new Error("無法讀取 Google 試算表資料"));
          };

          script.src = url.toString();
          document.body.appendChild(script);
        });
      }

      async function sheetPost(action, item) {
        await fetch(SHEET_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8",
          },
          body: JSON.stringify({ action, item }),
        });
      }

      async function loadItems() {
        if (!useSheetApi()) {
          state.items = loadLocalItems();
          setStatus("目前使用本機儲存。填入 Apps Script Web App URL 後會改用 Google 試算表。");
          render();
          return;
        }

        setStatus("讀取中");
        try {
          const data = await sheetJsonp("list");
          state.items = Array.isArray(data.items) ? data.items : [];
          setStatus("已連線");
        } catch (error) {
          state.items = loadLocalItems();
          setStatus(`${error.message}，暫時改用本機資料。`, true);
        }
        render();
      }

      function updateItemState(action, item) {
        const index = state.items.findIndex((current) => current.id === item.id);
        if (action === "delete") {
          state.items = state.items.filter((current) => current.id !== item.id);
        } else if (index >= 0) {
          state.items[index] = item;
        } else {
          state.items.unshift(item);
        }
      }

      async function persistItem(action, item) {
        if (!useSheetApi()) {
          updateItemState(action, item);
          saveLocalItems();
          render();
          return;
        }

        setStatus("正在同步 Google 試算表...");
        await sheetPost(action, item);
        updateItemState(action, item);
        setStatus("已同步 Google 試算表。");
        render();
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function money(value) {
        return Number(value || 0).toLocaleString("zh-TW");
      }

      function itemSubtotal(item) {
        return (Number(item.price) || 0) * (Number(item.quantity) || 1);
      }

      function itemSaleAmount(item) {
        return isSold(item) ? Math.max(0, Number(item.saleAmount) || 0) : 0;
      }

      function itemFinalTotal(item) {
        return Math.max(0, itemSubtotal(item) - itemSaleAmount(item));
      }

      function isSold(item) {
        return item?.sold === true || String(item?.sold || "").trim() === "已賣出";
      }

      function totalInventoryAmount() {
        return state.items.reduce((total, item) => total + itemFinalTotal(item), 0);
      }

      function toggleSaleAmountField(statusSelect, field, input) {
        if (!statusSelect || !field || !input) return;
        const shouldShow = statusSelect.value === "已賣出";
        field.classList.toggle("conditional-hidden", !shouldShow);
        field.hidden = !shouldShow;
        input.disabled = !shouldShow;
        if (!shouldShow) input.value = "";
      }

      function normalizeRating(value) {
        if (value === "" || value === null || value === undefined) return 0;
        return Math.min(5, Math.max(0, Math.round(Number(value) || 0)));
      }

      function renderRating(value) {
        const rating = normalizeRating(value);
        if (rating <= 0) return "";
        return `
        <span class="rating" title="評價 ${rating} / 5" aria-label="評價 ${rating} / 5">
          ${Array.from({ length: 5 }, (_, index) => `<i class="fa-${index < rating ? "solid" : "regular"} fa-star${index >= rating ? " rating-empty" : ""}" aria-hidden="true"></i>`).join("")}
        </span>
      `;
      }

      function itemImages(item) {
        if (!item) return [];
        if (Array.isArray(item.images)) return item.images.filter(Boolean);
        if (!item.images) return [];
        try {
          const parsed = JSON.parse(item.images);
          return Array.isArray(parsed) ? parsed.filter(Boolean) : [];
        } catch {
          return [];
        }
      }

      function platformMerchant(value) {
        return String(value || "未填平台").trim();
      }

      function renderImagePreview() {
        if (!els.imagePreview) return;
        els.imagePreview.innerHTML = renderImagePreviewMarkup();
      }

      function renderImagePreviewMarkup() {
        return state.editingImages
          .map(
            (src, index) => `
            <div class="preview-item">
              <img class="preview-img" src="${escapeHtml(src)}" alt="品項圖片 ${index + 1}" data-image-view="${index}" />
              <button class="image-remove-btn" type="button" title="刪除圖片" data-image-remove="${index}">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
              </button>
            </div>
          `,
          )
          .join("");
      }

      function syncBodyScrollLock() {
        const hasOpenModal = Boolean(document.querySelector(".modal.open"));
        document.body.style.overflow = hasOpenModal ? "hidden" : "";
      }

      function resetDialogScroll(modal) {
        const scrollTargets = modal.querySelectorAll(".dialog, form, .form-scroll, .detail-body, .category-list");
        scrollTargets.forEach((target) => {
          target.scrollTop = 0;
        });
      }

      function renderInlineEditForm(item) {
        els.detailModalTitle.textContent = "品項內容-編輯";
        fillCategoryOptions();
        state.editingImages = itemImages(item);
        els.detailBody.classList.add("editing");
        els.detailBody.innerHTML = `
          <form class="inline-form" id="detailEditForm">
            <div class="form-scroll">
              <input id="detailItemId" type="hidden" value="${escapeHtml(item.id)}" />
              <div class="field full">
                <label for="detailNameInput">品名 *</label>
                <input id="detailNameInput" required value="${escapeHtml(item.name)}" />
              </div>
              <div class="form-grid">
                <div class="field">
                  <label for="detailBrandInput">品牌</label>
                  <input id="detailBrandInput" value="${escapeHtml(item.brand || "")}" />
                </div>
                <div class="field">
                  <label for="detailCategoryInput">分類</label>
                  <select id="detailCategoryInput">
                    ${getCategories()
                      .map(
                        (category) =>
                          `<option value="${escapeHtml(category)}" ${category === item.category ? "selected" : ""}>${escapeHtml(category)}</option>`,
                      )
                      .join("")}
                  </select>
                </div>
                <div class="field">
                  <label for="detailSoldInput">狀態</label>
                  <select id="detailSoldInput">
                    <option value="庫存中" ${isSold(item) ? "" : "selected"}>庫存中</option>
                    <option value="已賣出" ${isSold(item) ? "selected" : ""}>已賣出</option>
                  </select>
                </div>
                <div class="field">
                  <label for="detailQuantityInput">數量</label>
                  <input id="detailQuantityInput" type="number" min="1" inputmode="numeric" value="${escapeHtml(item.quantity || 1)}" />
                </div>
                
                <div class="field">
                  <label for="detailPriceInput">單價</label>
                  <input id="detailPriceInput" type="text" min="0" inputmode="numeric" value="${escapeHtml(item.price || 0)}" />
                </div>
                  <div class="field ${isSold(item) ? "" : "conditional-hidden"}" id="detailSaleAmountField" ${isSold(item) ? "" : "hidden"}>
                  <label for="detailSaleAmountInput">賣出金額</label>
                  <input id="detailSaleAmountInput" type="text" min="0" inputmode="numeric" value="${escapeHtml(itemSaleAmount(item) || "")}" />

      function readImageFile(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const image = new Image();
            image.onload = () => {
              const maxSize = 900;
              const scale = Math.min(1, maxSize / Math.max(image.width, image.height));
              const canvas = document.createElement("canvas");
              canvas.width = Math.round(image.width * scale);
              canvas.height = Math.round(image.height * scale);
              const context = canvas.getContext("2d");
              context.drawImage(image, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL("image/jpeg", 0.78));
            };
            image.onerror = () => reject(new Error(`圖片格式無法讀取：${file.name}`));
            image.src = reader.result;
          };
          reader.onerror = () => reject(new Error(`讀取圖片失敗：${file.name}`));
          reader.readAsDataURL(file);
        });
      }

        gsap.fromTo(
          cards,
          { autoAlpha: 0, y: 18, scale: 0.98 },
          {
            autoAlpha: 1,
            y: 0,
            scale: 1,
            duration: 0.42,
            ease: "power2.out",
            stagger: 0.055,
            clearProps: "transform,opacity,visibility",
          },
        );
      }

      function animateModalOpen(modal) {
        if (!window.gsap || !modal) return;
        const dialog = modal.querySelector(".dialog");
        gsap.killTweensOf([modal, dialog]);
        gsap.set(modal, { autoAlpha: 0 });
        if (dialog) gsap.set(dialog, { autoAlpha: 0, y: 12 });

        requestAnimationFrame(() => {
          gsap.to(modal, { autoAlpha: 1, duration: 0.14, ease: "power1.out" });
          if (dialog) {
            gsap.to(dialog, {
              autoAlpha: 1,
              y: 0,
              duration: 0.22,
              ease: "sine.out",
              clearProps: "transform,opacity,visibility",
            });
          }
        });
      }

      async function renameCategory(oldName, newName) {
        const cleanName = newName.trim();
        if (!cleanName || cleanName === ALL_CATEGORY || cleanName === oldName) return;
        if (getCategories().includes(cleanName)) {
          alert("這個分類名稱已經存在。");
          return;
        }

        state.categories = normalizeCategories(state.categories.map((category) => (category === oldName ? cleanName : category)));

        const affectedItems = state.items.filter((item) => item.category === oldName).map((item) => ({ ...item, category: cleanName }));

        state.items = state.items.map((item) => (item.category === oldName ? { ...item, category: cleanName } : item));
        if (state.selectedCategory === oldName) state.selectedCategory = cleanName;
        saveCategories();
        if (!useSheetApi()) saveLocalItems();

        render();
        renderCategoryManager();

        if (useSheetApi() && affectedItems.length > 0) {
          setStatus("正在同步分類名稱到 Google 試算表...");
          for (const item of affectedItems) {
            await sheetPost("update", item);
          }
          setStatus("分類名稱已同步 Google 試算表。");
        }
      }

      function deleteCategoryDraft(index) {
        const categoryName = state.categoryDraft[index];
        const isUsed = state.items.some((item) => item.category === categoryName);
        if (isUsed) {
          alert("這個分類已經有品項使用。請先改名，或把品項移到其他分類後再刪除。");
          return;
        }

        state.categoryDraft.splice(index, 1);
        state.categoryDraft = normalizeCategories(state.categoryDraft);
        state.categoryDirty = true;
        setCategorySaveState("未儲存");
        renderCategoryManager();

      async function saveAllCategoryEdits(options = {}) {
        const draftValues = getCategoryDraftFromInputs();
        const trimmedValues = draftValues.map((value) => value.trim());
        const duplicates = trimmedValues.filter((value, index) => value && trimmedValues.indexOf(value) !== index);
        const nextCategories = normalizeCategories(trimmedValues);
        const currentCategories = state.categoryOriginal || [];

        if (trimmedValues.some((value) => !value)) {
          setCategoryStatus("分類名稱不可空白。", true);
          setCategorySaveState("儲存失敗", true);
          return;
        }

        if (duplicates.length > 0) {
          setCategoryStatus(`分類名稱不可重複：${[...new Set(duplicates)].join("、")}`, true);
          setCategorySaveState("儲存失敗", true);
          return;
        }

        for (const [oldIndex, oldName] of currentCategories.entries()) {
          if (!nextCategories.includes(oldName)) {
            const replacementName = trimmedValues[oldIndex];
            const isRename = Boolean(replacementName) && replacementName !== oldName;
            if (isRename) continue;

            const isUsed = state.items.some((item) => item.category === oldName);
            if (isUsed) {
              setCategoryStatus(`「${oldName}」分類已經有品項使用。請改名，不要直接刪除。`, true);
              setCategorySaveState("儲存失敗", true);
              return;
            }
          }
        }

        state.savingMessage = "正在儲存";
        state.isSaving = true;
        setCategoryStatus("");
        setCategorySaveState("儲存中");
        setStatus("分類儲存中...");
        render();

        try {
          const renamedItems = state.items
            .map((item) => {
              const oldIndex = currentCategories.indexOf(item.category);
              const nextCategory = oldIndex >= 0 ? nextCategories[oldIndex] : item.category;
              return nextCategory && nextCategory !== item.category ? { ...item, category: nextCategory } : item;
            })
            .filter((item) => {
              const original = state.items.find((current) => current.id === item.id);
              return original && original.category !== item.category;
            });

          state.items = state.items.map((item) => {
            const oldIndex = currentCategories.indexOf(item.category);
            const nextCategory = oldIndex >= 0 ? nextCategories[oldIndex] : item.category;
            return nextCategory && nextCategory !== item.category ? { ...item, category: nextCategory } : item;
          });

          if (state.selectedCategory !== ALL_CATEGORY) {
            const oldIndex = currentCategories.indexOf(state.selectedCategory);
            if (oldIndex >= 0 && nextCategories[oldIndex]) state.selectedCategory = nextCategories[oldIndex];
            if (!nextCategories.includes(state.selectedCategory)) state.selectedCategory = ALL_CATEGORY;
          }

          state.categories = nextCategories;
          saveCategories();
          if (!useSheetApi()) saveLocalItems();

          if (useSheetApi() && renamedItems.length > 0) {
            setStatus("正在同步分類名稱到 Google 試算表...");
            for (const item of renamedItems) {
              await sheetPost("update", item);
            }
            setStatus("分類名稱已同步 Google 試算表。");
          }

          state.categoryDraft = [...nextCategories];
          state.categoryOriginal = [...nextCategories];
          state.categoryDirty = false;
          fillCategoryOptions();
          renderCategoryManager();
          setCategorySaveState("已儲存");
          setStatus("分類已儲存。");
          if (options.closeAfterSave) closeCategoryModal();
        } finally {
          state.isSaving = false;
          render();
        }
      }

          render();
        }
      }

      async function handleDetailSave(event) {
        event.preventDefault();
        const item = {

          brand: document.querySelector("#detailBrandInput").value.trim(),
          category: document.querySelector("#detailCategoryInput").value,
          price: Number(document.querySelector("#detailPriceInput").value) || 0,
          rating: normalizeRating(document.querySelector("#detailRatingInput").value),
          quantity: Number(document.querySelector("#detailQuantityInput").value) || 1,
          sold: document.querySelector("#detailSoldInput").value,
          saleAmount:
            document.querySelector("#detailSoldInput").value === "已賣出" ? Number(document.querySelector("#detailSaleAmountInput").value) || 0 : 0,
          platform: document.querySelector("#detailPlatformInput").value.trim(),
          note: document.querySelector("#detailNoteInput").value.trim(),
          images: state.editingImages,
        };

        state.savingMessage = "正在儲存";
        state.isSaving = true;
        render();
        try {
          await persistItem("update", item);
          state.detailMode = "view";
          openDetail(item);
        } catch (error) {
          setStatus(`儲存失敗：${error.message}`, true);
        } finally {
          state.isSaving = false;
          render();
        }
      }

      async function handleItemAction(event) {
        const target = event.target.closest("[data-action]");
        if (!target) return;

        const item = state.items.find((current) => current.id === target.dataset.id);
        if (!item) return;

        if (target.dataset.action === "detail") {
          openDetail(item);
          return;
        }
      }

      async function handleDetailAction(event) {
        const button = event.target.closest("[data-detail-action]");
        if (!button) return;

        const item = state.items.find((current) => current.id === state.selectedItemId);
        if (!item) return;

        if (button.dataset.detailAction === "edit") {
          state.detailMode = "edit";
          renderDetail(item);
          return;
        }

        if (button.dataset.detailAction === "back") {
          state.detailMode = "view";
          renderDetail(item);
          return;
        }

        if (button.dataset.detailAction === "delete") {
          openDeleteConfirm(item);
          return;
        }
      }

      async function confirmDeleteSelectedItem() {
        const item = state.items.find((current) => current.id === state.pendingDeleteItemId);
        if (!item) {
          closeDeleteConfirm();
          return;
        }

        state.savingMessage = "正在刪除";
        state.isSaving = true;
        render();
        try {
          await persistItem("delete", item);
          closeDeleteConfirm();
          closeDetail();
        } catch (error) {
          setStatus(`刪除失敗：${error.message}`, true);
        } finally {
          state.isSaving = false;
          state.savingMessage = "正在儲存";
          render();
        }
      }

      fillCategoryOptions();
      render();
      loadItems();

      els.categoryBar.addEventListener("click", (event) => {
        const button = event.target.closest("[data-category]");
        if (!button) return;
        state.selectedCategory = button.dataset.category;
        render();
      });

      els.filterToggleButton.addEventListener("click", () => {
        const isOpen = els.categoryNavRow.classList.toggle("open");
        els.filterToggleButton.classList.toggle("active", isOpen);
        els.filterToggleButton.setAttribute("aria-expanded", String(isOpen));
      });

      els.searchInput.addEventListener("input", (event) => {
        state.searchQuery = event.target.value;
        render();
      });

      els.scrollTopButton.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      window.addEventListener("scroll", () => {
        els.scrollTopButton.classList.toggle("visible", window.scrollY > 240);
      });

      els.gridButton.addEventListener("click", () => {
        state.viewMode = "grid";
        render();
      });

      els.listButton.addEventListener("click", () => {
        state.viewMode = "list";
        render();
      });

      els.addButton.addEventListener("click", () => openModal());
      els.totalAmountButton.addEventListener("click", openTotalAmountModal);
      els.categoryManageButton.addEventListener("click", openCategoryModal);
      els.closeButton.addEventListener("click", closeModal);
      els.categoryCloseButton.addEventListener("click", requestCloseCategoryModal);
      els.saveCategoriesButton.addEventListener("click", saveAllCategoryEdits);
      els.categoryUnsavedCancelXButton.addEventListener("click", closeCategoryUnsavedModal);
      els.categoryUnsavedDiscardButton.addEventListener("click", discardCategoryChanges);
      els.categoryUnsavedSaveButton.addEventListener("click", saveAndCloseCategoryModal);
      els.deleteCancelXButton.addEventListener("click", closeDeleteConfirm);
      els.deleteCancelButton.addEventListener("click", closeDeleteConfirm);
      els.deleteConfirmButton.addEventListener("click", confirmDeleteSelectedItem);
      els.totalAmountCloseButton.addEventListener("click", closeTotalAmountModal);
      els.addCategoryButton.addEventListener("click", addCategory);
      els.newCategoryInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") addCategory();
      });
      els.categoryList.addEventListener("click", handleCategoryAction);
      els.categoryList.addEventListener("input", (event) => {
        const input = event.target.closest("[data-category-index]");
        if (!input) return;
        state.categoryDraft[Number(input.dataset.categoryIndex)] = input.value;
        state.categoryDirty = true;
        setCategorySaveState("未儲存");
      });
      els.form.addEventListener("submit", handleSave);
      els.soldInput.addEventListener("change", () => {
        toggleSaleAmountField(els.soldInput, els.saleAmountField, els.saleAmountInput);
      });
      els.imageInput.addEventListener("change", async (event) => {
        const files = Array.from(event.target.files || []);
        if (!files.length) return;

        try {
          const images = await Promise.all(files.map(readImageFile));
          state.editingImages = [...state.editingImages, ...images];
          renderImagePreview();
        } catch (error) {
          setStatus(error.message, true);
        }
      });
      els.imagePreview.addEventListener("click", (event) => {
        const button = event.target.closest("[data-image-remove]");
        if (button) {
          state.editingImages.splice(Number(button.dataset.imageRemove), 1);
          renderImagePreview();
          return;
        }

        const image = event.target.closest("[data-image-view]");
        if (image) openImageViewer(state.editingImages[Number(image.dataset.imageView)]);
      });
      els.gridView.addEventListener("click", handleItemAction);
      els.listView.addEventListener("click", handleItemAction);
      els.gridView.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        handleItemAction(event);
      });
      els.listView.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        handleItemAction(event);
      });
      els.detailBody.addEventListener("click", handleDetailAction);
      els.detailBody.addEventListener("submit", handleDetailSave);
      els.detailBody.addEventListener("change", async (event) => {
        if (event.target.id === "detailSoldInput") {
          toggleSaleAmountField(event.target, document.querySelector("#detailSaleAmountField"), document.querySelector("#detailSaleAmountInput"));
          return;
        }

        if (event.target.id !== "detailImageInput") return;
        const files = Array.from(event.target.files || []);
        if (!files.length) return;

        try {
          const images = await Promise.all(files.map(readImageFile));
          state.editingImages = [...state.editingImages, ...images];
          const preview = document.querySelector("#detailImagePreview");
          if (preview) preview.innerHTML = renderImagePreviewMarkup();
        } catch (error) {
          setStatus(error.message, true);
        }
      });
      els.detailBody.addEventListener("click", (event) => {
        const button = event.target.closest("[data-image-remove]");
        if (button && state.detailMode === "edit") {
          state.editingImages.splice(Number(button.dataset.imageRemove), 1);
          const preview = document.querySelector("#detailImagePreview");
          if (preview) preview.innerHTML = renderImagePreviewMarkup();
          return;
        }

        const image = event.target.closest("[data-image-view]");
        if (image && state.detailMode === "edit") {
          openImageViewer(state.editingImages[Number(image.dataset.imageView)]);
          return;
        }

        const detailImage = event.target.closest("[data-detail-image-view]");
        if (detailImage && state.detailMode === "view") {
          const item = state.items.find((current) => current.id === state.selectedItemId);
          if (!item) return;
          openImageViewer(itemImages(item)[Number(detailImage.dataset.detailImageView)]);
        }
      });
      els.detailCloseButton.addEventListener("click", closeDetail);
      els.imageViewerCloseButton.addEventListener("click", closeImageViewer);
      els.modal.addEventListener("click", (event) => {
        if (event.target === els.modal) closeModal();
      });
      els.detailModal.addEventListener("click", (event) => {
        if (event.target === els.detailModal) closeDetail();
      });
      els.categoryModal.addEventListener("click", (event) => {
        if (event.target === els.categoryModal) requestCloseCategoryModal();
      });
      els.deleteConfirmModal.addEventListener("click", (event) => {
        if (event.target === els.deleteConfirmModal) closeDeleteConfirm();
      });
      els.totalAmountModal.addEventListener("click", (event) => {
        if (event.target === els.totalAmountModal) closeTotalAmountModal();
      });
      els.categoryUnsavedModal.addEventListener("click", (event) => {
        if (event.target === els.categoryUnsavedModal) closeCategoryUnsavedModal();
      });
      els.imageViewerModal.addEventListener("click", (event) => {
        if (event.target === els.imageViewerModal) closeImageViewer();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeModal();
          closeDetail();
          requestCloseCategoryModal();
          closeDeleteConfirm();
          closeTotalAmountModal();
          closeCategoryUnsavedModal();
          closeImageViewer();
        }
      });
    </script>
  </body>
</html>
